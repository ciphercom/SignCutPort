name: release

# Publish a GitHub Release with the macOS app, either by pushing a tag like
# v0.2, or by running this workflow manually with a tag name: the tag is then
# created on the commit the workflow runs on (Actions › release › Run workflow).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v0.1"
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: cargo test -p signcut-core

      - name: Build Apple Silicon app (ad-hoc signed, identity "-")
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npx tauri build --target aarch64-apple-darwin

      - name: Verify signature and package
        run: |
          set -euo pipefail
          BUNDLE=target/aarch64-apple-darwin/release/bundle
          APP="$BUNDLE/macos/SignCut Port.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | tee sig.txt
          grep -q "Signature=adhoc" sig.txt
          for b in "$APP"/Contents/MacOS/*; do echo "$b: $(lipo -archs "$b")"; done
          mkdir -p out
          ditto -c -k --keepParent "$APP" "out/SignCut-Port-${TAG}-macOS-arm64.app.zip"
          cp "$BUNDLE"/dmg/*.dmg "out/SignCut-Port-${TAG}-macOS-arm64.dmg"
          (cd out && shasum -a 256 * > SHA256SUMS.txt)
          ls -la out

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > notes.md <<NOTES
          SignCut Port for macOS (Apple Silicon, macOS 11+).

          **Install**
          1. Download \`SignCut-Port-${TAG}-macOS-arm64.dmg\` and drag *SignCut Port* to Applications.
          2. The app is ad-hoc signed (not notarized). On first launch macOS will refuse to open it:
             - macOS 15+: open **System Settings › Privacy & Security**, scroll down and click **Open Anyway** for SignCut Port.
             - macOS 14 and older: right-click the app › **Open** › **Open**.
             - Or in Terminal: \`xattr -dr com.apple.quarantine "/Applications/SignCut Port.app"\`
          3. After that it opens normally.

          See the README for connecting a VEVOR cutter and the first test cut.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            # Creates the tag on this commit if it does not exist yet.
            gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "SignCut Port $TAG" --notes-file notes.md
          fi
